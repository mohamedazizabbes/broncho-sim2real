# Replace the placeholder source with your RGB image or video dataset.
sources:
  - name: dataset
    type: images
    path: data/images
    pattern: "**/*"
    split_group_size: 1
    split_group_parent: 1

image_size: 256
batch_size: 4
num_workers: 0
val_fraction: 0.1
depth_cache_dir: data/brea-depth
depth_cache_namespace: brea-depth

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.0
  quarter_turn_probability: 0.0
  color_jitter: 0.1
  hue_jitter: 0.02
  gamma: 0.1

quality_filter:
  enabled: false
